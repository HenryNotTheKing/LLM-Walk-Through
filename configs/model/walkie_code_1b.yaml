# Walkie-Code-1B 主配置：~964M 参数，纯英文 Python 代码专精
name: walkie_code_1b
model_name: Walkie-Code-1B

# 词表 / 上下文
vocab_size: 65536
block_size: 2048

# 主体维度
n_embd: 1536
n_layer: 36
n_head: 24
n_head_kv: 8
head_dim: 64
d_ffn: 3840

# 归一化 / 位置 / FFN 选项
rms_norm_eps: 1.0e-6
rope_theta: 1.0e6
rope_scaling_factor: 1.0
qk_norm: true

# 通用
dropout: 0.0
bias: false
tie_weights: true
attn_impl: flash_attn2
init_std: 0.02

# 数据流水线侧使用的 special tokens
special_tokens:
  endoftext: "<|endoftext|>"
  pad: "<|pad|>"
