# GPT-2 small (124M) 官方尺寸，用于 HF 权重对齐
name: gpt2_124m
vocab_size: 50257
n_layer: 12
n_head: 12
n_embd: 768
block_size: 1024
dropout: 0.0
bias: true              # GPT-2 使用 bias
tie_weights: true       # lm_head 与 token embedding 共享
attn_impl: sdpa         # sdpa | eager；CUDA 上 sdpa 会自动选 flash 内核
init_std: 0.02
