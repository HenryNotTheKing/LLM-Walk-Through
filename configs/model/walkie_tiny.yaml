# Walkie tiny 冒烟配置：CPU 几秒可跑通
name: walkie_tiny
model_name: Walkie-Tiny

vocab_size: 256
block_size: 128

n_embd: 128
n_layer: 2
n_head: 4
n_head_kv: 2
head_dim: 32
d_ffn: 256

rms_norm_eps: 1.0e-6
rope_theta: 10000.0
rope_scaling_factor: 1.0
qk_norm: true

dropout: 0.0
bias: false
tie_weights: true
attn_impl: sdpa
init_std: 0.02
