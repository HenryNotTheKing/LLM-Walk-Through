defaults:
  model: configs/model/gpt2_tiny.yaml

# Hugging Face 中文数据子集 + gpt2_tiny，默认跑一个很小的子集验证训练流程
data:
  name: hf_text
  cache_dir: data/cache/smoltalk_chinese_small
  hf:
    repo_id: opencsg/smoltalk-chinese
    subset_name: null
    split: train
    text_field: null                    # 留空时自动推断 text/messages 等字段
    max_samples: 2000                   # 只取一个小子集，保证本地可快速跑通
    max_chars: 2000000                  # 双保险：限制总文本字符数
    val_ratio: 0.1
    hf_endpoint: https://hf-mirror.com
  tokenizer:
    kind: bpe                           # bpe | byte_bpe | wordpiece | unigram | gpt2
    vocab_size: 2048                    # 仅在自训分词器时使用（gpt2 走预训练词表）
    train_on_first_n_chars: 200000      # 仅 tiny_shakespeare 路径使用；HF 数据可忽略

train:
  out_dir: runs/smoltalk_chinese_small
  batch_size: 16
  block_size: 64
  grad_accum_steps: 1
  max_steps: 200
  eval_interval: 50
  eval_iters: 20
  log_interval: 10

  # 优化器
  optimizer: adamw
  learning_rate: 3.0e-3
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  # 学习率调度
  lr_schedule: cosine                  # constant | cosine
  warmup_steps: 20
  min_lr: 3.0e-4

  # 精度与设备
  device: auto                         # auto | cuda | mps | cpu
  dtype: auto                          # auto | float32 | bfloat16 | float16
  amp: true                            # 仅在 cuda 且 dtype != float32 时实际启用

  seed: 1337
  compile: false                       # torch.compile，默认关，避免 MPS 下不稳定

distributed:
  backend: none                        # none | ddp
